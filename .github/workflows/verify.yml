name: Verify public witness log

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-witness-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install verification dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run regression tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v

      - name: Verify public chain
        run: python scripts/verify_chain.py

      - name: Scan tracked public text for privacy leakage
        run: python scripts/privacy_scan.py

      - name: Inspect OpenTimestamps commitments
        run: python scripts/manage_ots.py status

      - name: Confirm verification is read-only
        run: git diff --exit-code
